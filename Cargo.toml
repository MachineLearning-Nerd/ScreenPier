[package]
name = "screenpier"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
adler2 = "2.0.1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
xkbcommon = "0.9"
rustix = { version = "1", features = ["event", "fs", "net", "pipe", "process"] }
thiserror = "2"
png = "0.17"

anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }

[dev-dependencies]
tempfile = "3"
